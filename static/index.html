<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PageFaithful</title><style>:root{color-scheme:light}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#eef2ed;color:#14251a;font:16px/1.5 system-ui,-apple-system,"Microsoft YaHei",sans-serif}.card{width:min(100%,650px);padding:38px;border:1px solid #dbe4da;border-radius:24px;background:#fff;box-shadow:0 20px 60px #18352116}h1{margin:0;font-size:32px;letter-spacing:-.8px}p{color:#506056}.sub{margin-top:5px}.field{display:block;margin:25px 0 16px;font-weight:650}.file{display:block;margin-top:8px;padding:22px;border:1.5px dashed #9db7a2;border-radius:14px;background:#f8fbf8;color:#46604c;font-weight:400;cursor:pointer}.file input{display:block;margin-top:12px;max-width:100%}select,button{width:100%;border-radius:12px;padding:13px 14px;font:inherit}select{margin:8px 0 18px;border:1px solid #c9d5ca;background:#fff}button{border:0;background:#186038;color:#fff;font-weight:750;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.notice{margin:20px 0 0;padding:13px 14px;border-radius:12px;background:#f3f7f1;color:#536457;font-size:14px}.status{min-height:24px;margin:14px 0 0;font-size:14px;color:#4d6653}.error{color:#ae2b2b}</style></head><body><main class="card"><h1>PageFaithful</h1><p class="sub">在你的电脑本机翻译 PDF；图片和图片内文字会原样保留。</p><form id="form"><label class="field">选择电子书 PDF<span class="file"><span id="file-label">选择一个可复制文字的 PDF</span><input id="file" type="file" name="file" accept="application/pdf" required></span></label><label class="field">翻译为<select name="language"><option>Chinese (Simplified)</option><option>English</option><option>Japanese</option><option>French</option><option>German</option></select></label><button id="submit" type="submit">翻译并下载 PDF</button></form><p id="status" class="status"></p><p class="notice">最多 300 页。程序按段落而非逐行翻译，并会显示实时进度。扫描版、密码保护 PDF 暂不支持。</p></main><script>const form=document.querySelector('#form'),button=document.querySelector('#submit'),status=document.querySelector('#status'),file=document.querySelector('#file');let timer;file.addEventListener('change',()=>document.querySelector('#file-label').textContent=file.files[0]?.name||'选择一个可复制文字的 PDF');async function updateProgress(){try{const p=await fetch('/progress').then(r=>r.json());if(p.stage==='translating'){const live=p.received?`；已接收约 ${Math.round(p.received/1000)}k 字译文`:'';status.textContent=`${p.message}：${p.completed} / ${p.total} 页${live}`;}else if(p.stage==='building')status.textContent=`${p.message}：${p.completed} / ${p.total} 页`;else if(p.message)status.textContent=p.message;}catch{}}form.addEventListener('submit',async(e)=>{e.preventDefault();button.disabled=true;status.className='status';status.textContent='正在读取 PDF…';timer=setInterval(updateProgress,700);try{const r=await fetch('/translate',{method:'POST',body:new FormData(form)});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.detail||'翻译失败');}const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(file.files[0]?.name||'book.pdf').replace(/\.pdf$/i,'')+'_translated.pdf';a.click();URL.revokeObjectURL(url);status.textContent='完成，译后 PDF 已开始下载。'}catch(err){status.className='status error';status.textContent=err.message;}finally{clearInterval(timer);button.disabled=false;}});</script></body></html>
